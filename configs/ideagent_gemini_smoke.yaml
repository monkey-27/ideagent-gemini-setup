data:
  input_jsonl: data/gemini_smoke_topic.jsonl
  output_dir: results/gemini-smoke

run:
  init_topic_idx: 0
  end_topic_idx: 1
  resume: true
  max_background_tokens: 800

  # One independent seed and no auxiliary repair/polish drafts. This is intended
  # to verify the end-to-end runner with minimal Gemini API usage.
  max_budget: 1
  forced_exploration_steps: 1
  soundness_n: 1
  soundness_floor: 60
  soundness_fatal_threshold: 3
  soundness_fatal_min_votes: 1

  nb_min: 60
  clarity_min: 60
  feasibility_actionable_min: 60
  diversity_D: 60
  repair_margin: 20
  repair_diversity_D: 45

  accepted_capacity: 1
  accepted_refinement_limit: 0
  novelty_branch_limit: 0
  repair_capacity: 1
  repair_attempt_limit: 1
  auxiliary_attempt_limit: 0
  press_nb_target: 90
  press_soundness_target: 80
  press_clarity_target: 80
  press_feasibility_target: 0
  rejected_pending_cap: 20
  consolidate_every: 12
  signature_char_cap: 256
  history_field_char_cap: 120

  relative_nb_max_retries: 0

  early_nb_weight: 0.70
  early_soundness_weight: 0.20
  early_clarity_weight: 0.10
  late_nb_weight: 0.40
  late_soundness_weight: 0.40
  late_clarity_weight: 0.20

  repair_priority_novelty_weight: 0.50
  repair_priority_closeness_weight: 0.35
  repair_priority_remaining_weight: 0.15
  repair_closeness_soundness_weight: 0.55
  repair_closeness_nb_weight: 0.15
  repair_closeness_clarity_weight: 0.30

  refinement_priority_novelty_weight: 0.60
  refinement_priority_headroom_weight: 0.25
  refinement_priority_remaining_weight: 0.15
  refinement_headroom_soundness_weight: 0.65
  refinement_headroom_clarity_weight: 0.35
  seed: 0

client:
  request_timeout: 300

agents:
  ideator:
    model_id: gemini-3.6-flash
    api_key_env: GEMINI_API_KEY
    temperature: 0.7
    top_p: 0.95
    enable_thinking: false
    max_new_tokens: 2048

  critic:
    model_id: gemini-3.6-flash
    api_key_env: GEMINI_API_KEY
    temperature: 0.7
    top_p: 0.95
    enable_thinking: false
    max_new_tokens: 1024

  quality:
    model_id: gemini-3.6-flash
    api_key_env: GEMINI_API_KEY
    temperature: 0.2
    top_p: 0.95
    enable_thinking: false
    max_new_tokens: 1024

  steno:
    model_id: gemini-3.6-flash
    api_key_env: GEMINI_API_KEY
    temperature: 0.2
    top_p: 0.95
    enable_thinking: false
    max_new_tokens: 512

  judge:
    model_id: gemini-3.6-flash
    api_key_env: GEMINI_API_KEY
    temperature: 0.2
    top_p: 0.95
    enable_thinking: false
    max_new_tokens: 512
